<p-dialog
    [(visible)]="isShow"
    [modal]="true"
    [closable]="true"
    [draggable]="false"
    [style]="{ width: '650px' }"
    [header]="existingData ? 'Edit Campaign Media' : 'Add Campaign Media'"
>

    <!-- ================= FORM SECTION ================= -->
    <div class="section">

        <div class="section-title">Campaign Media Form</div>

        <div class="form-grid">

            <!-- Screen -->
            <div class="flex flex-column gap-2">
                <label>Screen *</label>
                <p-dropdown
                    [(ngModel)]="campaignMedia.screenId"
                    [options]="screenOptions"
                    optionLabel="name"
                    optionValue="id"
                    placeholder="Select screen"
                    [showClear]="true"
                    [filter]="true"
                ></p-dropdown>
            </div>

            <!-- Media -->
            <div class="flex flex-column gap-2">
                <label>Media *</label>
                <p-dropdown
                    [(ngModel)]="campaignMedia.mediaId"
                    [options]="mediaOptions"
                    optionLabel="name"
                    optionValue="id"
                    placeholder="Select media"
                    [showClear]="true"
                    [filter]="true"
                ></p-dropdown>
            </div>

            <!-- Play Date -->
            <div class="flex flex-column gap-2">
                <label>Play Date *</label>
                <input
                    type="date"
                    pInputText
                    [(ngModel)]="campaignMedia.playDate"
                />
            </div>

            <!-- Time -->
            <div class="time-grid">

                <div class="flex flex-column gap-2">
                    <label>Start *</label>
                    <input type="time" pInputText [(ngModel)]="campaignMedia.startTime" />
                </div>

                <div class="flex flex-column gap-2">
                    <label>End *</label>
                    <input type="time" pInputText [(ngModel)]="campaignMedia.endTime" />
                </div>

            </div>

            <!-- Duration -->
            <div class="flex flex-column gap-2">
                <label>Duration</label>
                <p-inputNumber [(ngModel)]="campaignMedia.duration" [min]="0"></p-inputNumber>
            </div>

            <!-- Order -->
            <div class="flex flex-column gap-2">
                <label>Order</label>
                <p-inputNumber [(ngModel)]="campaignMedia.order" [min]="1"></p-inputNumber>
            </div>

        </div>
    </div>

    <!-- ================= EXISTING DATA SECTION ================= -->
    <div class="section info-section">

        <div class="section-title">Existing Campaign Media</div>

        <campaign-media-info
            *ngIf="campaignMedia.campaignId > 0"
            [campaignId]="campaignMedia.campaignId">
        </campaign-media-info>

    </div>

    <!-- ================= FOOTER ================= -->
    <ng-template pTemplate="footer">
        <div class="flex justify-content-end gap-2">
            <p-button
                label="Cancel"
                severity="secondary"
                (onClick)="onCancel()">
            </p-button>

            <p-button
                label="Save"
                severity="primary"
                (onClick)="onSubmit()">
            </p-button>
        </div>
    </ng-template>

</p-dialog>
