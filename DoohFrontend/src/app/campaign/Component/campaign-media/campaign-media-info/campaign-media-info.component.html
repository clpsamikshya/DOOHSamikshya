<p *ngIf="!data?.length">No data found</p>

<!-- ================= TABLE ================= -->
<p-table *ngIf="data?.length" [value]="data">

    <ng-template pTemplate="header">
        <tr>
            <th *ngIf="showPreview" style="width: 80px">Preview</th>
            <th>Screen</th>
            <th>Media</th>
            <th>Play Order</th>
            <th>Date</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
        <tr>

            <!-- ================= THUMBNAIL PREVIEW (Only if enabled) ================= -->
            <td *ngIf="showPreview">
                <!-- IMAGE -->
                <img
                    *ngIf="isImage(row.mediaUrl)"
                    [src]="row.mediaUrl"
                    class="ml-preview-img ml-clickable"
                    (click)="openPreview(row)"
                    style="width:60px;height:40px;object-fit:cover;border-radius:4px;cursor:pointer"
                />

                <!-- VIDEO -->
                <div
                    *ngIf="isVideo(row.mediaUrl)"
                    class="ml-clickable"
                    (click)="openPreview(row)"
                    style="position:relative;width:60px;height:40px;background:#000;border-radius:4px;overflow:hidden;cursor:pointer"
                >
                    <video
                        [src]="row.mediaUrl + '#t=1'"
                        style="width:100%;height:100%;object-fit:cover"
                        muted
                    ></video>

                    <div
                        style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.35)"
                    >
                        <i class="pi pi-play-circle" style="color:#fff;font-size:1.2rem"></i>
                    </div>
                </div>
            </td>

            <td>{{ row.screenName }}</td>
            <td>{{ row.mediaName }}</td>
            <td>{{ row.playOrder }}</td>
            <td>{{ row.playDate }}</td>

        </tr>
    </ng-template>

</p-table>

<!-- ================= LIGHTBOX PREVIEW (Only if enabled) ================= -->
<p-dialog
    *ngIf="showPreview"
    [(visible)]="previewVisible"
    [modal]="true"
    [dismissableMask]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '90vw', maxWidth: '1100px' }"
    [contentStyle]="{ padding: '0', background: '#000' }"
    (onHide)="closePreview()"
>

    <ng-template pTemplate="header">
        <span style="color:#fff;font-weight:500">
            {{ previewMedia?.mediaName }}
        </span>
    </ng-template>

    <ng-template pTemplate="content">

        <!-- IMAGE -->
        <img
            *ngIf="previewMedia && isImage(previewMedia.mediaUrl)"
            [src]="previewMedia.mediaUrl"
            style="width:100%;max-height:80vh;object-fit:contain"
        />

        <!-- VIDEO -->
        <video
            *ngIf="previewMedia && isVideo(previewMedia.mediaUrl)"
            [src]="previewMedia.mediaUrl"
            controls
            autoplay
            style="width:100%;max-height:80vh"
        ></video>

    </ng-template>

</p-dialog>
