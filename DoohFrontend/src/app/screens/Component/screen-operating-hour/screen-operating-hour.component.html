<p-dialog
    [(visible)]="visible"
    [modal]="true"
    [closable]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '520px' }"
    (onHide)="onHide()"
>
    <ng-template pTemplate="header">
        <div class="op-hours-dialog-header">
            <i class="pi pi-clock"></i>
            <span>Operating Hours</span>
            <span class="op-hours-screen-name">{{ selectedScreenName }}</span>
        </div>
    </ng-template>

    <ng-container *ngIf="selectedOperatingHours.length; else noHours">
        <p-table
            [value]="selectedOperatingHours"
            styleClass="p-datatable-sm p-datatable-striped"
        >
            <ng-template pTemplate="header">
                <tr>
                    <th>Day</th>
                    <th>Open</th>
                    <th>Close</th>
                    <th>Avg. Audience</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-oh>
                <tr>
                    <td>
                        <span *ngIf="oh.isEveryday; else specificDay">
                            <i class="pi pi-calendar mr-1"></i>Every Day
                        </span>
                        <ng-template #specificDay>
                            {{ getDayLabel(oh.dayOfWeek) }}
                        </ng-template>
                    </td>
                    <td>
                        <i class="pi pi-sun mr-1 text-orange-400"></i>
                        {{ formatTime(oh.startTime) }}
                    </td>
                    <td>
                        <i class="pi pi-moon mr-1 text-blue-400"></i>
                        {{ formatTime(oh.endTime) }}
                    </td>
                    <td>
                        <i class="pi pi-users mr-1 text-green-500"></i>
                        {{ oh.avgAudienceCount | number }}
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </ng-container>

    <ng-template #noHours>
        <div class="no-hours-placeholder">
            <i class="pi pi-clock"></i>
            <p>No operating hours configured for this screen.</p>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <p-button
            label="Close"
            icon="pi pi-times"
            severity="secondary"
            (onClick)="onHide()"
        />
    </ng-template>
</p-dialog>
