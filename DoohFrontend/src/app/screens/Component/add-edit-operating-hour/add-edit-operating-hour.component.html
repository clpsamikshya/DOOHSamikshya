<!-- Dialog wrapper - only in standalone mode -->
<p-dialog
    *ngIf="!isEmbedded"
    [(visible)]="isVisible"
    header="Manage Operating Hours"
    [modal]="true"
    [style]="{ width: '800px' }"
    [draggable]="false"
    [resizable]="false"
    styleClass="operating-hours-dialog"
>
    <ng-container *ngTemplateOutlet="editorContent"></ng-container>

    <!-- Footer Actions - Only in dialog mode -->
    <div class="dialog-footer">
        <p-button
            label="Cancel"
            severity="secondary"
            [text]="true"
            (click)="cancel()"
            type="button"
        />
        <p-button
            label="Save Changes"
            severity="success"
            (click)="saveAndClose()"
            type="button"
        />
    </div>
</p-dialog>

<!-- Embedded mode - content only, no dialog wrapper -->
<ng-container *ngIf="isEmbedded">
    <ng-container *ngTemplateOutlet="editorContent"></ng-container>
</ng-container>

<!-- Shared content template -->
<ng-template #editorContent>
    <div class="operating-hours-editor">
        <!-- ─── Add New Slot Form ─── -->
        <div class="oh-form-card">
            <h3 class="section-title">Add Time Slot</h3>
            
            <div class="form-field">
                <label class="form-label required">Select Days</label>
                <div class="day-pill-group">
                    <button
                        *ngFor="let day of dayOptions"
                        type="button"
                        class="day-pill"
                        [class.selected]="draftSlot.selectedDays.includes(day.value)"
                        (click)="toggleDay(day.value)"
                    >
                        {{ day.label.slice(0, 3) }}
                    </button>
                </div>
                <small class="field-hint">
                    Select one or more days for this time slot
                </small>
            </div>

            <div class="time-row">
                <div class="form-field">
                    <label class="form-label required">Start Time</label>
                    <input
                        pInputText
                        type="time"
                        [(ngModel)]="draftSlot.startTime"
                        name="draftStart"
                        class="w-full"
                    />
                </div>
                
                <div class="form-field">
                    <label class="form-label required">End Time</label>
                    <input
                        pInputText
                        type="time"
                        [(ngModel)]="draftSlot.endTime"
                        name="draftEnd"
                        class="w-full"
                    />
                </div>
                
                <div class="form-field">
                    <label class="form-label">Avg. Audience</label>
                    <input
                        pInputText
                        type="number"
                        [(ngModel)]="draftSlot.avgAudienceCount"
                        name="draftAudience"
                        placeholder="0"
                        min="0"
                        class="w-full"
                    />
                </div>
            </div>

            <p-button
                label="Add Slot"
                icon="pi pi-plus"
                severity="success"
                [outlined]="true"
                size="small"
                type="button"
                (click)="confirmSlot()"
            />
        </div>

        <!-- ─── Current Slots Table ─── -->
        <div class="oh-list-section">
            <h3 class="section-title">Current Schedule</h3>

            <div *ngIf="getActiveSlotList().length > 0" class="oh-summary">
                <table class="oh-table">
                    <thead>
                        <tr>
                            <th>Day</th>
                            <th>Open</th>
                            <th>Close</th>
                            <th>Avg. Audience</th>
                            <th style="width: 50px"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <ng-container *ngFor="let slot of getActiveSlotList(); trackBy: trackBySlotId">
                            <tr *ngFor="let day of getSlotDayRows(slot)">
                                <td>{{ day.label }}</td>
                                <td>{{ slot.startTime }}</td>
                                <td>{{ slot.endTime }}</td>
                                <td>{{ slot.avgAudienceCount }}</td>
                                <td>
                                    <p-button
                                        icon="pi pi-trash"
                                        severity="danger"
                                        [text]="true"
                                        [rounded]="true"a
                                        size="small"
                                        type="button"
                                        (click)="removeSlot(slot, day.value)"
                                    />
                                </td>
                            </tr>
                        </ng-container>
                    </tbody>
                </table>
            </div>

            <!-- Empty State -->
            <div *ngIf="getActiveSlotList().length === 0" class="oh-empty">
                <i class="pi pi-clock" style="font-size: 2rem; opacity: 0.25"></i>
                <p>No operating hours added yet.</p>
                <small>Use the form above to add time slots.</small>
            </div>
        </div>
    </div>
</ng-template>
