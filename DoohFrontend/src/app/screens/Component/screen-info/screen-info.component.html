<p-dialog
    [(visible)]="isShow"
    header="Screen Details"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '700px' }"
    styleClass="screen-info-dialog"
    (onHide)="close()"
>

    <!-- LOADING STATE (no spinner as requested) -->
    <div *ngIf="isLoading" class="loading-wrap">
        <p-message
            severity="info"
            text="Loading screen details..."
        ></p-message>
    </div>

    <!-- DATA STATE -->
    <div *ngIf="!isLoading && screen" class="screen-info">

        <!-- =====================================================
             BASIC INFORMATION
        ====================================================== -->
        <div class="section">
            <div class="section-title">
                Basic Information
            </div>

            <div class="info-grid">

                <div class="info-item">
                    <label>Name</label>
                    <span>{{ screen.name }}</span>
                </div>

                <div class="info-item">
                    <label>Code</label>
                    <span>{{ screen.code }}</span>
                </div>

                <div class="info-item">
                    <label>Location</label>
                    <span>{{ screen.location }}</span>
                </div>

                <div class="info-item">
                    <label>Resolution</label>
                    <span>{{ screen.resolution }}</span>
                </div>

                <div class="info-item">
                    <label>Orientation</label>
                    <span>{{ screen.orientationName }}</span>
                </div>

                <div class="info-item">
                    <label>Status</label>
                    <p-tag
                        [value]="screen.statusName"
                        [severity]="screen.status === 1 ? 'success' : 'danger'"
                    ></p-tag>
                </div>

            </div>
        </div>

        <!-- =====================================================
             DEVICE INFORMATION
        ====================================================== -->
        <div class="section">
            <div class="section-title">
                Device Information
            </div>

            <div class="info-grid">

                <div class="info-item">
                    <label>Device Id</label>
                    <span>{{ screen.deviceId }}</span>
                </div>

                <div class="info-item">
                    <label>IP Address</label>
                    <span>{{ screen.ipAddress }}</span>
                </div>

                <div class="info-item">
                    <label>MAC Address</label>
                    <span>{{ screen.macAddress }}</span>
                </div>

                <div class="info-item">
                    <label>Last Active</label>
                    <span>{{ screen.lastActiveAt | date:'medium' }}</span>
                </div>

            </div>
        </div>

        <!-- =====================================================
             REMARKS
        ====================================================== -->
        <div class="section" *ngIf="screen.remarks">

            <div class="section-title">
                Remarks
            </div>

            <div class="remarks-box">
                {{ screen.remarks }}
            </div>

        </div>

    </div>

    <!-- =====================================================
         EMPTY STATE (safety fallback)
    ====================================================== -->
    <div *ngIf="!isLoading && !screen">
        <p-message
            severity="warn"
            text="No screen data found."
        ></p-message>
    </div>

    <!-- FOOTER -->
    <ng-template pTemplate="footer">
        <p-button
            label="Close"
            icon="pi pi-times"
            severity="secondary"
            (onClick)="close()"
        ></p-button>
    </ng-template>

</p-dialog>
