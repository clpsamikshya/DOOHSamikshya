<p-dialog
    [(visible)]="isShow"
    [header]="existingData ? 'Edit Screen' : 'Add Screen'"
    [modal]="true"
    [style]="{ width: '750px' }"
    [draggable]="false"
    [resizable]="false"
    styleClass="screen-dialog"
    (onHide)="onCancel()"
>
    <form (ngSubmit)="onSubmit()" #screenForm="ngForm">
        <p-tabView>
            <!-- ─── TAB 1: Screen Details ─── -->
            <p-tabPanel header="Screen">
                <div class="form-grid">
                    <div class="form-field">
                        <label for="name" class="form-label required">
                            Screen Name
                        </label>
                        <input
                            pInputText
                            id="name"
                            name="name"
                            [(ngModel)]="screen.name"
                            placeholder="Enter screen name"
                            required
                            #nameInput="ngModel"
                            class="w-full"
                        />
                        <small
                            class="error-message"
                            *ngIf="nameInput.invalid && nameInput.touched"
                        >
                            Screen name is required
                        </small>
                    </div>

                    <div class="form-field">
                        <label for="location" class="form-label required">
                            Location
                        </label>
                        <input
                            pInputText
                            id="location"
                            name="location"
                            [(ngModel)]="screen.location"
                            placeholder="e.g., 27.7172, 85.3240"
                            required
                            #locationInput="ngModel"
                            class="w-full"
                        />
                        <small
                            class="error-message"
                            *ngIf="locationInput.invalid && locationInput.touched"
                        >
                            Location is required
                        </small>
                    </div>

                    <div class="form-field">
                        <label for="resolution" class="form-label required">
                            Resolution
                        </label>
                        <input
                            pInputText
                            id="resolution"
                            name="resolution"
                            [(ngModel)]="screen.resolution"
                            placeholder="e.g., 1920x1080"
                            required
                            #resolutionInput="ngModel"
                            class="w-full"
                        />
                        <small
                            class="error-message"
                            *ngIf="resolutionInput.invalid && resolutionInput.touched"
                        >
                            Resolution is required
                        </small>
                    </div>

                    <div class="form-field">
                        <label for="orientation" class="form-label">
                            Orientation
                        </label>
                        <p-dropdown
                            id="orientation"
                            name="orientation"
                            [(ngModel)]="screen.orientation"
                            [options]="orientationOptions"
                            optionLabel="label"
                            optionValue="value"
                            placeholder="Select orientation"
                            styleClass="w-full"
                        />
                    </div>

                    <div class="form-field">
                        <label for="status" class="form-label">
                            Status
                        </label>
                        <p-dropdown
                            id="status"
                            name="status"
                            [(ngModel)]="screen.status"
                            [options]="statusOptions"
                            optionLabel="label"
                            optionValue="value"
                            placeholder="Select status"
                            styleClass="w-full"
                        />
                    </div>

                    <div class="form-field full-width">
                        <label for="tags" class="form-label">
                            Tags
                        </label>
                        <p-chips
                            id="tags"
                            name="tags"
                            [(ngModel)]="screen.tag"
                            placeholder="Add tags (press Enter)"
                            styleClass="w-full"
                            separator=","
                            ngDefaultControl
                        />
                        <small class="field-hint">
                            Press Enter or comma to add multiple tags
                        </small>
                    </div>
                </div>
            </p-tabPanel>

            <!-- ─── TAB 2: Operating Hours (Embedded Child Component) ─── -->
            <p-tabPanel header="Operating Hours">
                <add-edit-operating-hour
                    [slotList]="slotList"
                    [screenId]="existingData?.id ?? null"
                    [existingOperatingHours]="existingData?.operatingHour || []"
                    (slotsUpdated)="onSlotsUpdated($event)"
                    [isEmbedded]="true"
                ></add-edit-operating-hour>
            </p-tabPanel>
        </p-tabView>

        <!-- Footer -->
        <div class="dialog-footer">
            <p-button
                label="Cancel"
                severity="secondary"
                [text]="true"
                (click)="onCancel()"
                type="button"
            />
            <p-button
                [label]="(existingData ? 'Update' : 'Add') + ' Screen'"
                severity="success"
                [disabled]="screenForm.invalid"
                type="submit"
            />
        </div>
    </form>
</p-dialog>
